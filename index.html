        <h1>Lian Wang (Lianzijun Wang · 王莲子君)</h1>
        <h2>PhD Candidate in Biology · Duke University</h2>
        <p>
          Welcome to the personal and academic portfolio of <strong>Lian Wang</strong> (Lianzijun Wang), a Biology PhD student at <strong>Duke University</strong> conducting research in the <strong>Sherwood Lab</strong> (Department of Biology).
        </p>
        <p>
          Her doctoral research uses the <em>Caenorhabditis elegans</em> anchor cell invasion model to investigate how invasive cells breach basement membrane, reorganize their cytoskeleton, protect the plasma membrane, and adapt mitochondrial metabolism under mechanical challenge.
        </p>
        <p>
          Prior to Duke, Lian earned her bachelor's degree at <strong>Baylor University</strong> (Biochemistry and Cell & Molecular Biology, Summa Cum Laude), conducting research in Dr. Myeongwoo Lee's lab.
        </p>
