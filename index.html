<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Academic and creative portfolio for Lianzijun (Lian) Wang, PhD candidate in Biology at Duke University."
    />
    <title>Lianzijun Wang Portfolio</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var queryTheme = params.get('theme');
          var saved = localStorage.getItem('theme');
          var theme = (queryTheme === 'dark' || queryTheme === 'light')
            ? queryTheme
            : (saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
